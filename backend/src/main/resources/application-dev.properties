# Configuração básica da aplicação
spring.application.name=backend
server.port=8181

# Configuração do DataSource
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=desafio_mazzatech_dev;encrypt=true;trustServerCertificate=true
spring.datasource.username=app_user
spring.datasource.password=App@Pass123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Configuração do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
jwt.secret=segredoMuitoSeguro
jwt.expiration=86400000