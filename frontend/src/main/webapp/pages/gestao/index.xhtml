<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	template="/WEB-INF/templates/template.xhtml">

	<ui:define name="titulo">
		Gestão de Clientes
	</ui:define>

	<ui:define name="conteudo">

		<div class="card crud">
			<h:form id="form">
				<p:growl id="messages" showDetail="true" />

				<p:remoteCommand name="clearCliente"
					action="#{gestaoController.limparSelecao}" update=":dialogs" />

				<p:toolbar
					style="width: 80%; max-width: 1300px; margin: 0 auto; margin-top:50px;">
					<p:toolbarGroup>
						<p:commandButton value="Novo Cliente" icon="pi pi-plus"
							actionListener="#{gestaoController.novoClienteOpen}"
							update=":dialogs:manage-cliente-content"
							oncomplete="PF('manageClienteDialog').show()"
							styleClass="ui-button-success" style="margin-right: .5rem">
							<p:resetInput target=":dialogs:manage-cliente-content" />
						</p:commandButton>
					</p:toolbarGroup>
				</p:toolbar>

				<p:dataTable
					style="width: 80%; max-width: 1300px; margin: 0 auto; margin-top:10px;"
					id="dt-clientes" widgetVar="dtClientes"
					value="#{gestaoController.clientes}" var="cliente" reflow="true"
					styleClass="clientes-table"
					selection="#{gestaoController.clienteSelecionado}"
					rowKey="#{cliente.id}" paginator="true" rows="10"
					selectionRowMode="add" paginatorPosition="bottom">
					<f:facet name="header">
						<div class="clientes-table-header">
							<span style="font-weight: bold">Clientes</span> <span
								class="filter-container ui-input-icon-left"> <i
								class="pi pi-search"></i> <p:inputText id="globalFilter"
									onkeyup="PF('dtClientes').filter()" placeholder="Pesquisar..." />
							</span>
						</div>
					</f:facet>

					<p:column width="05%" headerText="id" sortBy="#{cliente.id}">
						<h:outputText value="#{cliente.id}" />
					</p:column>

					<p:column width="05%" headerText="Logotipo" exportable="false">
						<h:graphicImage
							value="#{gestaoController.baseUrl}/clientes/#{cliente.id}/logotipo"
							styleClass="cliente-image" width="60" height="auto" />
					</p:column>

					<p:column width="20%" headerText="Nome" sortBy="#{cliente.nome}">
						<h:outputText value="#{cliente.nome}" />
					</p:column>

					<p:column width="25%" headerText="Email" sortBy="#{cliente.email}">
						<h:outputText value="#{cliente.email}" />
					</p:column>

					<p:column width="25%" headerText="Logradouros"
						sortBy="#{cliente.logradouros}">
						<p:dataList value="#{cliente.logradouros}" var="logradouro"
							varStatus="status">
							<h:outputText
								value="#{status.index + 1}: #{logradouro.logradouro}" />
							<br />
						</p:dataList>
					</p:column>

					<p:column width="10%" headerText="Ações" exportable="false"
						style="width:120px">
						<p:commandButton icon="pi pi-pencil"
							update=":dialogs:manage-cliente-content"
							oncomplete="PF('manageClienteDialog').show()"
							styleClass="edit-button rounded-button ui-button-success"
							process="@this">

							<f:setPropertyActionListener value="#{cliente}"
								target="#{gestaoController.clienteSelecionado}" />
							<p:resetInput target=":dialogs:manage-cliente-content" />
						</p:commandButton>

						<p:commandButton class="ui-button-warning rounded-button"
							icon="pi pi-trash" process="@this"
							oncomplete="PF('deleteClienteDialog').show()">
							<f:setPropertyActionListener value="#{cliente}"
								target="#{gestaoController.clienteSelecionado}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</h:form>

			<h:form id="dialogs" enctype="multipart/form-data">
				<p:dialog header="Detalhes do Cliente"
					widgetVar="manageClienteDialog" modal="true" width="600"
					responsive="true" onHide="PF('clearCliente').send()">
					<p:outputPanel id="manage-cliente-content" class="ui-fluid">
						<p:outputPanel
							rendered="#{gestaoController.clienteSelecionado ne null}">

							<div class="field" style="margin-top: 7px; text-align: center;">
								<ui:fragment
									rendered="#{not empty gestaoController.previewLogotipo}">
									<p:graphicImage value="#{gestaoController.previewLogotipo}"
										width="200" height="auto"
										style="border-radius: 5px; margin-top:5px" />
								</ui:fragment>

								<ui:fragment
									rendered="#{empty gestaoController.previewLogotipo and not empty gestaoController.clienteSelecionado.id}">
									<h:graphicImage
										value="#{gestaoController.baseUrl}/clientes/#{gestaoController.clienteSelecionado.id}/logotipo"
										width="200" height="auto"
										style="border-radius: 5px; margin-top:5px" />
								</ui:fragment>
							</div>

							<div class="field" style="margin-top: 7px; text-align: right;">
								<p:outputLabel for="logotipoUpload"></p:outputLabel>
								<p:fileUpload id="logotipoUpload"
									value="#{gestaoController.logotipoUpload}" mode="simple"
									auto="false" skinSimple="true" label="Selecionar logotipo"
									sizeLimit="3000000" allowTypes="/(\.|\/)(gif|jpe?g|png)$/" />
							</div>

							<div class="field" style="margin-top: 7px">
								<p:outputLabel for="nome">Nome Completo</p:outputLabel>
								<p:inputText id="nome"
									value="#{gestaoController.clienteSelecionado.nome}"
									required="true" style="width: 100%" />
							</div>

							<div class="field" style="margin-top: 7px">
								<p:outputLabel for="email">Email</p:outputLabel>
								<p:inputText id="email"
									value="#{gestaoController.clienteSelecionado.email}"
									required="true" style="width: 100%" />
							</div>

							<div class="field" style="margin-top: 7px">
								<p:outputLabel>Logradouros</p:outputLabel>
								<p:dataList id="listaLogradouros"
									value="#{gestaoController.clienteSelecionado.logradouros}"
									var="logradouro" style="width:100%">
									<p:inputText value="#{logradouro.logradouro}"
										style="width: calc(100% - 30px); margin-bottom:5px" />
									<p:commandButton icon="pi pi-trash"
										styleClass="ui-button-danger"
										action="#{gestaoController.temp}" update="listaLogradouros"
										immediate="true" />
								</p:dataList>

								<p:commandButton value="Adicionar logradouro" icon="pi pi-plus"
									action="#{gestaoController.adicionarLogradouro}"
									update="listaLogradouros" process="@this"
									styleClass="ui-button-secondary" />
							</div>
						</p:outputPanel>
					</p:outputPanel>

					<f:facet name="footer">
						<p:commandButton value="Salvar" icon="pi pi-check"
							action="#{gestaoController.salvarCliente}"
							update=":form:dt-clientes, @form, :form:messages"
							process="manage-cliente-content @this @form"
							oncomplete="if(!args.validationFailed) PF('manageClienteDialog').hide()" />
						<p:commandButton value="Cancelar" icon="pi pi-times"
							onclick="PF('manageClienteDialog').hide()"
							class="ui-button-secondary" type="button" />
					</f:facet>
				</p:dialog>

				<p:confirmDialog widgetVar="deleteClienteDialog" showEffect="fade"
					width="300" message="Deseja realmente excluir este cliente?"
					header="Confirmação" severity="warn">
					<p:commandButton value="Sim" icon="pi pi-check"
						actionListener="#{gestaoController.deletarCliente}"
						process="@this" update=":form:dt-clientes, :form:messages"
						oncomplete="PF('deleteClienteDialog').hide()" />
					<p:commandButton value="Não" type="button"
						styleClass="ui-button-secondary" icon="pi pi-times"
						onclick="PF('deleteClienteDialog').hide()" />
				</p:confirmDialog>

				<p:confirmDialog global="true" showEffect="fade" width="300">
					<p:commandButton value="Sim" type="button"
						styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
					<p:commandButton value="Não" type="button"
						styleClass="ui-confirmdialog-no ui-button-secondary"
						icon="pi pi-times" />
				</p:confirmDialog>
			</h:form>
		</div>

	</ui:define>

</ui:composition>
