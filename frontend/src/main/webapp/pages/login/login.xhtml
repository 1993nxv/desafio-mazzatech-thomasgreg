<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Login</title>
</h:head>
<h:body>

    <h:form style="width:400px; margin:auto; margin-top:100px;">
        <p:panel header="Autenticação" styleClass="ui-panel-dark">
            <p:messages showDetail="true" />
            <p:inputText value="#{loginController.authRequest.username}" label="Usuário" placeholder="Usuário" />
            <p:password value="#{loginController.authRequest.password}" label="Senha" placeholder="Senha" />
			<br></br>
            <p:commandButton value="Entrar" icon="pi pi-sign-in"
                             action="#{loginController.login}" update="@form"/>
        </p:panel>
    </h:form>

    <h:panelGroup layout="block" style="text-align:center; margin-top:50px;">
        <h:outputText value="© 2025 - Thomas Greg" style="color:gray;" />
    </h:panelGroup>
</h:body>
</html>
