<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>

<meta charset="UTF-8" />
<title>Gestão de Clientes</title>

<h:outputStylesheet library="css" name="style.css" />

</h:head>

<h:body style="align-items: center;">
	<header style="text-align:center;">
		<h:graphicImage library="img" name="logo.png" />
		
		
		<div id="usuario-logado">
		    <h:form>
			    <p:commandButton value="Logout" 
			                   action="#{loginController.logout}"
			                   icon="pi pi-power-off"
			                   styleClass="logout-btn"
			                   rendered="#{loginController.existeUsuarioLogado()}"/>
			</h:form>
		</div>
	</header>
	
	<h2 style="text-align:center;">
		<ui:insert name="titulo"/>
	</h2>
	
	<div id="conteudo">
		<ui:insert name="conteudo"/>
	</div>
	
	<h:form id="formGlobal">
    <!-- Componente blockUI -->
	    <p:blockUI block=":formGlobal" widgetVar="blockUIWidget" 
		               trigger="@(form)">
		        <div class="blockui-content">
		            <p:graphicImage library="primefaces" name="loading.svg" width="64"/>
		            <h:outputText value="Processando..." style="margin-top:10px;display:block"/>
		        </div>
	    </p:blockUI>
	</h:form>
	    
	<footer>
		© 2025 - Thomas Greg
	</footer>
	
	<h:form>
		<p:confirmDialog global="true">
			
    		<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
   			<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
			 
		</p:confirmDialog>
	</h:form>
</h:body>

</html>
